name: automation-workflows
question: how is an n8n-like graph automation feature edited, executed headlessly, exposed in the canvas UI, and verified without weakening generic graph drawing?

aliases:
  - n8n automation workflow
  - executable workflow backend
  - custom automation nodes

inputs:
  - generic graph nodes, directed edges, and plugin-owned configuration
  - registered custom automation node executors
  - a concept-first feature change request

outputs:
  - deterministic headless workflow execution and failures
  - canvas commands, status overlays, inspector UI, and snapshot persistence
  - focused backend and UI tests with at least 99% statements, branches, functions, and lines
  - a transactionally applied edit that passes typecheck, full suite, and hidden acceptance

owns:
  - automation document schema and custom node registry
  - deterministic backend execution independent of DOM and canvas state
  - graph-to-backend adapter, commands, events, persistence, inspector, and status badges
  - "maintained native recipe: dx/experiments/file-projections/recipes/automation-workflows.change.json"
  - "apply sequence: fp change plan -change <recipe> -out .fp-plan.json; fp change apply -plan .fp-plan.json -out .fp-apply.json"
  - recipe coverage and post-verification concept improvement

sources:
  - symbol: AutomationBackend
  - symbol: createAutomationBackend
  - symbol: executeAutomation
  - symbol: registerAutomation
  - symbol: registerSystems
  - symbol: registerSnapshotExtension
  - symbol: createAppContext
